<!DOCTYPE html>
<html>
<head>
<title>Baba Player ❤️</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
body{ background:#1a1a1a; color:white; text-align:center; font-family:sans-serif; padding:20px; }
input{ width:85%; padding:12px; border-radius:10px; border:none; font-size:16px; }
button{ padding:12px 20px; background:#ff4da6; color:white; border:none; border-radius:10px; margin:5px; font-size:15px; cursor:pointer; }
video{ width:95%; max-width:800px; margin-top:20px; border-radius:15px; background:black; }
#downloadBtn{ display:none; background:#00d166; }
#qualityBox{ display:none; margin-top:10px; }
#qualityBox button{ background:#333; padding:8px 14px; font-size:14px; }
#qualityBox button.active{ background:#ff4da6; }
</style>
</head>
<body>
<h2>Hi Baba! 🥰 Link eka danna</h2>
<input id="link" placeholder="Link eka methana danna...">
<br><br>
<button onclick="playVideo()">▶️ Play</button>
<button id="downloadBtn" onclick="downloadVideo()">⬇️ Download</button>
<br>
<div id="qualityBox">
  <span>Quality: </span>
  <button onclick="setQuality(-1, this)" class="active">Auto ✨</button>
  <button onclick="setQuality(1080, this)">1080p</button>
  <button onclick="setQuality(720, this)">720p</button>
  <button onclick="setQuality(540, this)">540p</button>
  <button onclick="setQuality(480, this)">480p</button>
  <button onclick="setQuality(360, this)">360p</button>
  <button onclick="setQuality(240, this)">240p</button>
</div>
<br>
<video id="video" controls></video>
<p id="status"></p>

<script>
let currentUrl = "";
let hls = null;

async function playVideo(){
  currentUrl = document.getElementById("link").value;
  document.getElementById("status").innerText = "Load wenawa baba... ❤️";
  let res = await fetch("/get_m3u8", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({url: currentUrl})});
  let data = await res.json();
  if(data.m3u8){
    let video = document.getElementById("video");
    if(hls){ hls.destroy(); }
    if(Hls.isSupported()){
      hls = new Hls();
      hls.loadSource(data.m3u8);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, ()=> video.play());
    } else if(video.canPlayType('application/vnd.apple.mpegurl')){
      video.src = data.m3u8;
      video.play();
    }
    document.getElementById("status").innerText = "Play wenawa baba! 🥰 " + (data.title || "");
    document.getElementById("downloadBtn").style.display = "inline-block";
    document.getElementById("qualityBox").style.display = "block";
  } else {
    document.getElementById("status").innerText = "Ayyo baba error: " + data.error;
  }
}

function setQuality(height, btn){
  document.querySelectorAll("#qualityBox button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  if(hls){
    if(height === -1){
      hls.autoLevelEnabled = true;
      document.getElementById("status").innerText = "Auto Quality baba! ✨";
    } else {
      hls.autoLevelEnabled = false;
      let best = 0;
      hls.levels.forEach((lvl, i)=>{
        if(lvl.height <= height) best = i;
      });
      hls.currentLevel = best;
      document.getElementById("status").innerText = height + "p walin play wenawa baba! 🥰";
    }
  }
}

async function downloadVideo(){
  document.getElementById("status").innerText = "Download wenawa baba... tikak inna ❤️";
  let res = await fetch("/download", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({url: currentUrl})});
  let blob = await res.blob();
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "baba_video.mp4";
  a.click();
}
</script>
</body>
</html>
